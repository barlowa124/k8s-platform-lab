apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-front
  namespace: preview
  labels:
    app: store-front
spec:
  replicas: 3
  selector:
    matchLabels:
      app: store-front
  template:
    metadata:
      labels:
        app: store-front
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: store-front
  namespace: preview
spec:
  selector:
    app: store-front
  ports:
    - port: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: store-front-config
  namespace: preview
data:
  banner: gitops-managed
