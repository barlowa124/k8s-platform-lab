apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: previewapps.platform.lab
spec:
  group: platform.lab
  scope: Namespaced
  names:
    plural: previewapps
    singular: previewapp
    kind: PreviewApp
    shortNames: [pva]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, port]
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
            status:
              type: object
              properties:
                phase:
                  type: string
                deploymentName:
                  type: string
                serviceName:
                  type: string
                readyReplicas:
                  type: integer
